plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version "${moddevgradle_version}"
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
        content {
            includeGroup "maven.modrinth"
        }
    }
    maven {
        name = "CaffeineMC"
        url = "https://maven.caffeinemc.net/releases"
    }
    mavenCentral()
}

configurations {
    rocksdbInternal
    // Platform natives for the LWJGL bindings Voxy ships. They end up inside the
    // nested jar of their binding instead of being nested on their own - see the
    // bundling tasks further down for why that matters.
    lwjglBindingNatives {
        canBeConsumed = false
        canBeResolved = true
    }
    runtimeClasspath.extendsFrom lwjglBindingNatives
}

def lwjglBindings = ['lmdb', 'zstd']
def lwjglBindingPlatforms = ['windows', 'linux']
if (project.findProperty('includeOtherArchs')?.toBoolean()) {
    lwjglBindingPlatforms += 'linux-arm64'
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
    withSourcesJar()
}

neoForge {
    version = project.neo_version
    accessTransformers = project.files('src/main/resources/META-INF/accesstransformer.cfg')

    runs {
        client {
            client()
        }
        server {
            server()
            programArgument '--nogui'
        }
    }

    mods {
        voxy {
            sourceSet sourceSets.main
        }
    }
}

def gitCommitHash = {
    try {
        def result = providers.exec {
            commandLine 'git', 'rev-parse', 'HEAD'
            ignoreExitValue = true
        }
        return result.result.get().exitValue == 0
                ? result.standardOutput.asText.get().trim()
                : '<UnknownCommit>'
    } catch (Exception ignored) {
        return '<UnknownCommit>'
    }
}

def buildtime = java.time.Instant.now().epochSecond.toString()

def generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    def replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            sodium_version_range   : sodium_version_range,
            commit                 : gitCommitHash(),
            buildtime              : buildtime
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into layout.buildDirectory.dir('generated/sources/modMetadata')
}

sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

dependencies {
    // Voxy's rendering integration depends on Sodium and its public configuration API.
    implementation "maven.modrinth:sodium:${sodium_version}"
    // The Modrinth NeoForge package wraps Sodium as a nested mod jar; compile against the unwrapped Maven artifact.
    compileOnly "net.caffeinemc:sodium-neoforge-mod:${sodium_api_version}"
    implementation "net.caffeinemc:sodium-neoforge-api:${sodium_api_version}"

    // Optional compatibility APIs used by Voxy when these mods are present.
    compileOnly "maven.modrinth:iris:${iris_version}"
    compileOnly "maven.modrinth:lithium:${lithium_version}"
    compileOnly "maven.modrinth:vivecraft:${vivecraft_version}"

    // Libraries used by Voxy's storage backends and importers.
    //
    // Only a floor is declared, never a hard pin. NeoForge's JarSelector intersects the
    // ranges of every mod that bundles the same artifact and fails the whole launch with
    // VERSION_RESOLUTION_FAILED when the intersection is empty, so a pinned range such
    // as strictly '[3.49.1.0]' makes Voxy incompatible with any mod that wants a newer
    // version. 'prefer' alone emits an open range ([<version>,)) and lets the selector
    // pick a version every bundled copy can live with.
    jarJar(implementation('redis.clients:jedis:5.1.0')) {
        version { prefer '5.1.0' }
    }
    if (project.findProperty('includeOtherArchs')?.toBoolean()) {
        jarJar(implementation('org.rocksdb:rocksdbjni:10.2.1')) {
            version { prefer '10.2.1' }
        }
    } else {
        implementation('org.rocksdb:rocksdbjni:10.2.1')
        rocksdbInternal('org.rocksdb:rocksdbjni:10.2.1')
    }
    jarJar(implementation('org.apache.commons:commons-pool2:2.12.0')) {
        version { prefer '2.12.0' }
    }
    jarJar(implementation('org.lz4:lz4-java:1.8.0')) {
        version { prefer '1.8.0' }
    }
    jarJar(implementation('org.tukaani:xz:1.10')) {
        version { prefer '1.10' }
    }
    jarJar(runtimeOnly('org.xerial:sqlite-jdbc:3.49.1.0')) {
        version { prefer '3.49.1.0' }
    }

    // Voxy uses these LWJGL bindings for memory-mapped storage and compression.
    // Minecraft already puts lwjgl (core, opengl, glfw and the platform natives) on
    // the game classpath, so only the LWJGL extensions Voxy loads itself get nested.
    implementation platform("org.lwjgl:lwjgl-bom:${lwjgl_version}")
    // Compile-only on purpose: nesting a second copy of the core jar breaks NeoForge's
    // jar-in-jar module layer. lwjgl ships its module descriptor inside the
    // multi-release section (META-INF/versions/25/module-info.class), where it exports
    // org.lwjgl.system.ffm - a package that exists only in that same section and is
    // absent from the jar root - so the nested copy resolves to a module with a
    // dangling export.
    compileOnly "org.lwjgl:lwjgl:${lwjgl_version}:unsafe"
    // The lwjgl-lmdb / lwjgl-zstd POMs depend on org.lwjgl:lwjgl; drop it so the core
    // jar cannot be pulled into the nested set again through transitivity.
    lwjglBindings.each { binding ->
        implementation("org.lwjgl:lwjgl-${binding}:${lwjgl_version}") {
            exclude group: 'org.lwjgl', module: 'lwjgl'
        }
        lwjglBindingNatives("org.lwjgl:lwjgl-${binding}:${lwjgl_version}") {
            exclude group: 'org.lwjgl', module: 'lwjgl'
        }
        lwjglBindingPlatforms.each { os ->
            lwjglBindingNatives("org.lwjgl:lwjgl-${binding}:${lwjgl_version}:natives-${os}")
        }
    }
}

// LWJGL publishes every platform native as a separate artifact that shares the Maven
// coordinates of the binding itself (org.lwjgl:lwjgl-zstd:3.4.1:natives-windows, ...),
// so they cannot be distinguished inside a jar-in-jar set: NeoForge's JarSelector keeps
// exactly one nested jar per group:artifact - select() picks a single winner with
// findFirst() and silently drops the rest. Nesting a binding and its natives separately
// therefore loses two thirds of them at runtime, which is what left
// org.lwjgl.util.zstd.Zstd missing. Merge each binding together with all of its platform
// natives into one nested jar so a single entry carries the whole binding.
def lwjglBindingNativesFiles = configurations.lwjglBindingNatives
lwjglBindings.each { binding ->
    def prefix = "lwjgl-${binding}-${lwjgl_version}"
    def bundleTask = tasks.register("bundleLwjgl${binding.capitalize()}", Jar) {
        archiveFileName.set("${prefix}.jar")
        // The binding jar and its natives jars both carry the same platform checksums
        // (META-INF/<platform>/.../*.sha1) - byte identical, so the first one wins.
        duplicatesStrategy = DuplicatesStrategy.EXCLUDE
        manifest {
            // Namespaced so the jar-in-jar identifier and the JPMS module name cannot
            // collide with another mod that happens to bundle the same binding. The LWJGL
            // module name is irrelevant to native loading: LibraryResource builds its
            // resource path from the binding's own package, not from this value.
            attributes('Automatic-Module-Name': "me.cortex.voxy.lwjgl.${binding}")
        }
        from(provider {
            lwjglBindingNativesFiles.findAll { it.name.startsWith(prefix) }.collect { zipTree(it) }
        })
        // Two copies of the same metadata would collide inside the merged jar.
        exclude 'META-INF/MANIFEST.MF'
        exclude 'META-INF/INDEX.LIST'
        // Drop the multi-release module descriptors: the packages they export are kept,
        // but FML reads the descriptor without the versioned section and would end up
        // with a module whose exports do not line up with the jar.
        exclude 'META-INF/versions/**'
    }
    dependencies {
        jarJar files(bundleTask)
    }
}

if (!project.findProperty('includeOtherArchs')?.toBoolean()) {
    def makeExcludedRocksDB = tasks.register('makeExcludedRocksDB', Jar) {
        entryCompression = ZipEntryCompression.STORED
        from { zipTree(configurations.rocksdbInternal.singleFile) }
        archiveFileName.set(providers.provider { configurations.rocksdbInternal.singleFile.name })
        manifest {
            // Repacked jars are declared through files(), so ModDevGradle cannot derive a
            // real version and pins the range to this archive's content hash. The
            // identifier therefore has to be unique to Voxy: another mod bundling
            // rocksdbjni the same way would claim ':org.rocksdb' with a different hash and
            // JarSelector would reject the launch with VERSION_RESOLUTION_FAILED.
            attributes('Automatic-Module-Name': 'me.cortex.voxy.rocksdb')
        }
        exclude { details ->
            def fileName = details.name
            if (fileName.endsWith('.jnilib')) {
                return true
            }
            if (!fileName.endsWith('.so')) {
                return false
            }
            return ['osx', 'linux32', 'musl', 's390x', 'riscv64', 'ppc64le', 'aarch64']
                    .any(fileName::contains)
        }
    }
    dependencies {
        jarJar files(makeExcludedRocksDB)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25
    options.deprecation = true
}

// Resolved during configuration: reading project state from inside the rename closure
// would run at execution time and is rejected by the configuration cache.
def licenseFileSuffix = "_${project.archives_base_name}"

tasks.named('jar', Jar).configure {
    manifest {
        attributes(
                'Implementation-Version': project.version,
                'Voxy-Commit': gitCommitHash()
        )
    }
    from('LICENSE.md') {
        rename { "${it}${licenseFileSuffix}" }
    }
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url = uri("${project.projectDir}/repo")
        }
    }
}
